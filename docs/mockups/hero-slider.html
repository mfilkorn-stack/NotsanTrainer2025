<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hero-Slider Mockup – NotSanTrainer 2025</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#06080f; --bg-surface:#0d1220; --border:#1a2236;
  --text:#f1f5f9; --text-muted:#94a3b8; --text-dim:#475569;
  --primary:#ef4444; --primary-end:#f97316;
  --blue:#60a5fa; --green:#10b981;
  --grad:linear-gradient(135deg,var(--primary),var(--primary-end));
  --grad-text:linear-gradient(90deg,var(--primary),var(--primary-end));
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Outfit',system-ui,sans-serif;font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.container{max-width:1100px;margin:0 auto;padding:0 clamp(1rem,5vw,2.5rem)}
.grad-text{background:var(--grad-text);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.badge{display:inline-flex;align-items:center;gap:.4rem;font-size:.78rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;background:rgba(239,68,68,.12);color:var(--primary);border:1px solid rgba(239,68,68,.25);border-radius:99px;padding:.3rem .85rem}
.badge::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--primary);animation:pulse-dot 1.8s ease-in-out infinite}
@keyframes pulse-dot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.8)}}

/* ── Hero ─────────────────────────────────────────────── */
#hero{
  position:relative;
  isolation:isolate;
  min-height:min(100vh,820px);
  padding:clamp(4rem,10vw,8rem) 0 clamp(3rem,7vw,6rem);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
.hero-content{position:relative;z-index:2;text-align:center;display:flex;flex-direction:column;align-items:center;gap:1.5rem}

/* ── Slider Stage ─────────────────────────────────────── */
.hero-stage{position:absolute;inset:0;z-index:0;pointer-events:none}
.hero-stage::after{
  /* Vignette: fokussiert den Inhalt, hält die Ränder ruhig */
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 70% 60% at 50% 45%,transparent 0%,rgba(6,8,15,.55) 70%,rgba(6,8,15,.92) 100%);
  z-index:5;pointer-events:none;
}

.scene{
  position:absolute;inset:0;
  opacity:0;
  transition:opacity 1.4s ease-in-out;
}
.scene.active{opacity:1}

/* ── Scene 1: EKG-Sweep ───────────────────────────────── */
.scene-ekg{display:flex;flex-direction:column;justify-content:center;gap:clamp(2rem,6vh,4.5rem);padding:clamp(2rem,8vh,5rem) 0}
.ekg-row{position:relative;height:clamp(70px,11vh,120px);overflow:hidden}
.ekg-row svg{position:absolute;left:0;top:0;width:200%;height:100%;display:block}
.ekg-row .trace{
  fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
  filter:drop-shadow(0 0 6px currentColor);
}
.ekg-row.r1 .trace{color:rgba(239,68,68,.9);animation:ekg-scroll 9s linear infinite}
.ekg-row.r2 .trace{color:rgba(96,165,250,.35);animation:ekg-scroll 13s linear infinite reverse}
.ekg-row.r3 .trace{color:rgba(249,115,22,.55);animation:ekg-scroll 11s linear infinite}
@keyframes ekg-scroll{
  0%{transform:translateX(0)}
  100%{transform:translateX(-50%)}
}
/* Beam: heller Sweep, der waagerecht durchläuft */
.scene-ekg .beam{
  position:absolute;inset:0;
  background:radial-gradient(ellipse 22% 60% at var(--bx,-20%) 50%,
      rgba(239,68,68,.22) 0%,
      rgba(249,115,22,.12) 40%,
      transparent 70%);
  animation:ekg-beam 7s ease-in-out infinite;
  mix-blend-mode:screen;
}
@keyframes ekg-beam{
  0%{--bx:-20%}
  50%{--bx:120%}
  100%{--bx:-20%}
}
@property --bx{syntax:'<percentage>';inherits:false;initial-value:-20%}

/* ── Scene 2: Pulse-Aura ──────────────────────────────── */
.scene-aura{position:absolute;inset:0}
.aura-blob{
  position:absolute;border-radius:50%;
  filter:blur(40px);
  will-change:transform,opacity;
  mix-blend-mode:screen;
}
.aura-core{
  width:min(70vw,720px);height:min(70vw,720px);
  left:50%;top:50%;transform:translate(-50%,-50%);
  background:radial-gradient(circle,
      rgba(239,68,68,.55) 0%,
      rgba(249,115,22,.32) 35%,
      rgba(239,68,68,.08) 60%,
      transparent 75%);
  animation:aura-beat 2.4s cubic-bezier(.4,0,.2,1) infinite;
}
.aura-tl{
  width:min(48vw,440px);height:min(48vw,440px);
  left:-8%;top:-12%;
  background:radial-gradient(circle,rgba(249,115,22,.42) 0%,rgba(249,115,22,.08) 50%,transparent 70%);
  animation:aura-beat 2.4s cubic-bezier(.4,0,.2,1) infinite .15s, aura-drift-a 16s ease-in-out infinite;
}
.aura-br{
  width:min(54vw,500px);height:min(54vw,500px);
  right:-10%;bottom:-15%;
  background:radial-gradient(circle,rgba(239,68,68,.4) 0%,rgba(239,68,68,.08) 50%,transparent 70%);
  animation:aura-beat 2.4s cubic-bezier(.4,0,.2,1) infinite .3s, aura-drift-b 18s ease-in-out infinite;
}
.aura-cool{
  width:min(40vw,380px);height:min(40vw,380px);
  right:8%;top:6%;
  background:radial-gradient(circle,rgba(96,165,250,.22) 0%,rgba(96,165,250,.06) 50%,transparent 70%);
  animation:aura-drift-c 22s ease-in-out infinite;
}
@keyframes aura-beat{
  0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.85}
  18%    {transform:translate(-50%,-50%) scale(1.06);opacity:1}
  32%    {transform:translate(-50%,-50%) scale(.99);opacity:.9}
  50%    {transform:translate(-50%,-50%) scale(1.02);opacity:.95}
  70%    {transform:translate(-50%,-50%) scale(1);opacity:.85}
}
/* Beat-Override: TL/BR/Cool nutzen eigene Translate-Origins */
.aura-tl{animation:aura-beat-tl 2.4s cubic-bezier(.4,0,.2,1) infinite .15s, aura-drift-a 16s ease-in-out infinite}
.aura-br{animation:aura-beat-br 2.4s cubic-bezier(.4,0,.2,1) infinite .3s,  aura-drift-b 18s ease-in-out infinite}
@keyframes aura-beat-tl{
  0%,100%{opacity:.7;transform:scale(1)}
  18%{opacity:.95;transform:scale(1.08)}
  50%{opacity:.8;transform:scale(1.02)}
}
@keyframes aura-beat-br{
  0%,100%{opacity:.7;transform:scale(1)}
  18%{opacity:.95;transform:scale(1.07)}
  50%{opacity:.8;transform:scale(1.02)}
}
@keyframes aura-drift-a{
  0%,100%{translate:0 0}
  50%{translate:6vw 4vh}
}
@keyframes aura-drift-b{
  0%,100%{translate:0 0}
  50%{translate:-5vw -3vh}
}
@keyframes aura-drift-c{
  0%,100%{translate:0 0;opacity:.6}
  50%{translate:-4vw 5vh;opacity:.85}
}

/* ── Scene 3: Algorithmus-Mesh ────────────────────────── */
.scene-mesh{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.scene-mesh svg{width:100%;height:100%;display:block}
.mesh-edge{
  fill:none;stroke:url(#meshGrad);stroke-width:1.4;
  stroke-linecap:round;
  opacity:.55;
  stroke-dasharray:6 10;
  animation:mesh-flow 4s linear infinite;
}
.mesh-edge.slow{animation-duration:7s;opacity:.32}
.mesh-edge.fast{animation-duration:2.6s;opacity:.7;stroke-width:1.8}
@keyframes mesh-flow{
  to{stroke-dashoffset:-32}
}
.mesh-node{
  fill:#0d1220;stroke:url(#meshGrad);stroke-width:1.6;
  filter:drop-shadow(0 0 6px rgba(239,68,68,.6));
}
.mesh-node-pulse{
  fill:#ef4444;
  transform-origin:center;transform-box:fill-box;
  animation:mesh-pulse 2.2s ease-in-out infinite;
}
.mesh-node-pulse.delay-1{animation-delay:.4s}
.mesh-node-pulse.delay-2{animation-delay:.8s}
.mesh-node-pulse.delay-3{animation-delay:1.2s}
.mesh-node-pulse.delay-4{animation-delay:1.6s}
@keyframes mesh-pulse{
  0%,100%{opacity:.8;transform:scale(1)}
  50%{opacity:.25;transform:scale(2.2)}
}
/* Sanftes Hintergrund-Leuchten unter dem Mesh */
.scene-mesh::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 60% 50% at 50% 50%,rgba(239,68,68,.18) 0%,transparent 60%);
  pointer-events:none;
}

/* ── Reduced Motion: Animationen abschalten, nur Aura statisch zeigen ─ */
@media (prefers-reduced-motion: reduce){
  .scene{transition:none}
  .scene,.scene.active{opacity:0}
  .scene-aura{opacity:1 !important}
  .aura-blob{animation:none !important;filter:blur(50px)}
  .ekg-row .trace,.scene-ekg .beam,.mesh-edge,.mesh-node-pulse,.badge::before{animation:none !important}
}

/* Toolbar – nur fürs Mockup, in der Landing entfernt */
.devbar{
  position:fixed;bottom:1rem;right:1rem;z-index:1000;
  display:flex;gap:.4rem;background:rgba(13,18,32,.85);backdrop-filter:blur(8px);
  border:1px solid var(--border);border-radius:99px;padding:.35rem;
}
.devbar button{
  background:transparent;color:var(--text-muted);border:none;
  font:600 .75rem 'Outfit',sans-serif;letter-spacing:.06em;text-transform:uppercase;
  padding:.45rem .85rem;border-radius:99px;cursor:pointer;transition:all .2s;
}
.devbar button:hover{color:var(--text)}
.devbar button.is-active{background:var(--grad);color:#fff}

/* Footer info */
.note{position:fixed;bottom:1rem;left:1rem;z-index:1000;color:var(--text-dim);font-size:.72rem;letter-spacing:.04em}
</style>
</head>
<body>

<section id="hero">

          <path class="mesh-edge fast" d="M 600 90 C 700 140, 780 170, 860 220"/>

          <!-- Layer 1 -> Layer 2 -->

<!-- Dev-Toolbar zum manuellen Szenenwechsel (nur Mockup) -->
<div class="devbar" role="tablist" aria-label="Szene wählen">
  <button data-scene="auto" class="is-active">Auto</button>
  <button data-scene="0">EKG</button>
  <button data-scene="1">Aura</button>
  <button data-scene="2">Mesh</button>
</div>
<div class="note">Hero-Slider Mockup · Auto-Wechsel alle 6 s</div>

<script>
(function(){
  const stage = document.querySelector('.hero-stage');
  const scenes = stage.querySelectorAll('.scene');
  const buttons = document.querySelectorAll('.devbar button');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let i = 0, timer = null;

  function show(idx){
    scenes.forEach((s,k)=>s.classList.toggle('active', k===idx));
  }
  function tick(){ i = (i+1) % scenes.length; show(i); }
  function startAuto(){
    stop();
    if(scenes.length === 0) return;
    show(i);
    if(!reduce) timer = setInterval(tick, 6000);
  }
  function stop(){ if(timer){ clearInterval(timer); timer = null; } }

  buttons.forEach(btn => btn.addEventListener('click', () => {
    buttons.forEach(b=>b.classList.remove('is-active'));
    btn.classList.add('is-active');
    const v = btn.dataset.scene;
    if(v === 'auto'){ i = 0; startAuto(); }
    else { stop(); show(parseInt(v,10)); }
  }));

  startAuto();
})();
</script>
